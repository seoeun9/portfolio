<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="scroll-content">
        <header>
            <img src="./leaf-icon.png" alt="leaf image" />
            <h1>Portfolio</h1>
            <div class="header-detail">안녕하세요, 저는 프론트엔드 개발자를 희망하고 있는 장서은입니다.</div>
            <div class="header-detail">만나서 반갑습니다!</div>

        </header>
        <nav>
            <button>Brief</button>
            <button>Detail</button>
        </nav>

        <main>
            <div class="brief-1">
                <img src="./apple.jpg" alt="apple image" width="900" height="600"/>
            </div>
            <div class="overlay-text">
                About me
            </div>
            <div class="overlay-card">
                <p class="section-title">[유연한 의사소통]</p>
                <p>저는 게임, 웹 사이트 등의 서비스 개발 활동에서 기획/디자인 팀원분들과 유연하게 소통한 경험이 있습니다.</p>
                
                <p class="section-title">[도전 정신]</p>
                <p>어려운 일에도 기꺼이 도전해 포기하지 않고 끝까지 해내는 성격을 가지고 있습니다.</p>

                <p class="section-title">[끈기와 성실함]</p>
                <p>목표를 달성하기 위해 끈기와 성실함을 바탕으로 꾸준히 노력하는 자세를 중요하게 생각합니다.</p>
            </div>
        </main>
    </div>



    <script src="starScript.js"></script>
    <script src="headerScroll.js"></script>
</body>
</html>
